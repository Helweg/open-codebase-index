name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
no-changes-template: '- No user-facing changes in this release.'
categories:
  - type: 'pre-exclude'
    when:
      label: 'skip-changelog'
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      label: 'semver:major'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      label: 'semver:minor'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels:
        - 'semver:patch'
        - 'bug'
        - 'dependencies'
        - 'documentation'
        - 'enhancement'
  - title: '🚀 Features'
    when:
      labels:
        - 'feature'
        - 'semver:minor'
  - title: '🐛 Fixes'
    when:
      labels:
        - 'bug'
        - 'semver:patch'
  - title: '⚡ Performance'
    when:
      label: 'performance'
  - title: '🧰 Maintenance'
    when:
      labels:
        - 'dependencies'
        - 'refactor'
        - 'chore'
  - title: '📚 Documentation'
    when:
      label: 'documentation'
  - title: '🧪 Tests'
    when:
      label: 'test'
autolabeler:
  - label: 'documentation'
    files:
      - '*.md'
      - 'docs/**'
  - label: 'test'
    files:
      - 'tests/**'
      - '**/*.test.ts'
  - label: 'dependencies'
    files:
      - 'package.json'
      - 'package-lock.json'
      - 'native/Cargo.toml'
      - 'native/Cargo.lock'
  - label: 'chore'
    files:
      - '.github/**'
template: |
  ## What changed

  $CHANGES

  ## Release checks

  - [ ] Draft notes reconciled against the full previous release tag diff (for example `git log --oneline <previous-tag>..HEAD`)
  - [ ] `CHANGELOG.md` updated
  - [ ] `package.json` version bumped
  - [ ] `npm run build && npm run typecheck && npm run lint && npm run test:run` passed
