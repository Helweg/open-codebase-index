name: CI

on:
  workflow_dispatch:
    inputs:
      capture_pre_edit_trace:
        description: Capture metadata-only pre-edit traces in one Linux Node 24 diagnostic
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  path-semantics:
    if: ${{ !inputs.capture_pre_edit_trace }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test canonical path semantics
        run: npx vitest run tests/canonical-path.test.ts

      - name: Record recursive native watcher capability
        run: npx vitest run tests/watcher-platform-capability.test.ts

      - name: Measure native watcher behavior
        run: npm run benchmark:watcher

  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.capture_pre_edit_trace && '["24"]' || '["22","24"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: native -> target

      - name: Install dependencies
        run: npm ci

      - name: Check Rust formatting
        working-directory: native
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: native
        run: cargo clippy -- -D warnings

      - name: Run Rust tests
        working-directory: native
        run: cargo test

      - name: Build native module
        working-directory: native
        run: |
          cargo build --release
          npx napi build --release --platform

      - name: Build TypeScript
        run: npm run build:ts

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Validate frozen cross-repo benchmark inputs and comparator contracts
        run: npm run benchmark:cross-repo:check

      - name: Validate frozen cross-repo source evidence against pinned revisions
        run: npm run benchmark:cross-repo:sources:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Smoke-test packed CLI and TypeScript consumer identities
        run: npm run smoke:package -- --output-dir "${RUNNER_TEMP}/packed-cli-node-${{ matrix.node }}"

      - name: Check published-to-candidate index compatibility
        if: matrix.node == '24'
        run: |
          npm run smoke:compatibility -- \
            --packages "${RUNNER_TEMP}/packed-cli-node-${{ matrix.node }}/validated-packages.json" \
            --output-dir "${RUNNER_TEMP}/package-compat-node-${{ matrix.node }}"

      - name: Upload package compatibility evidence
        if: always() && matrix.node == '24' && !inputs.capture_pre_edit_trace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-compat-linux-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/packed-cli-node-${{ matrix.node }}/validated-packages.json
            ${{ runner.temp }}/packed-cli-node-${{ matrix.node }}/command-*.json
            ${{ runner.temp }}/packed-cli-node-${{ matrix.node }}/stage-*/*.tgz
            ${{ runner.temp }}/package-compat-node-${{ matrix.node }}/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report watcher capture status
        if: failure() && !inputs.capture_pre_edit_trace
        run: node scripts/report-watcher-captures.mjs

      - name: Upload watcher capture status
        if: failure() && !inputs.capture_pre_edit_trace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watcher-capture-status-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocbi-watcher-capture-status/
          if-no-files-found: error
          retention-days: 14

      - name: Upload watcher failure diagnostics
        if: failure() && !inputs.capture_pre_edit_trace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watcher-failures-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocbi-watcher-failures/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Start mock embeddings server for eval smoke
        run: |
          node scripts/eval-mock-embeddings-server.mjs > /tmp/eval-mock-embeddings.log 2>&1 &
          echo $! > /tmp/eval-mock-embeddings.pid
          healthy=0
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:11434/health >/dev/null; then
              echo "Mock embeddings server is healthy"
              healthy=1
              break
            fi
            sleep 0.25
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Mock embeddings server failed health check"
            exit 1
          fi

      - name: Run eval harness smoke check (mock embeddings)
        run: |
          npm run eval:smoke -- --output "${RUNNER_TEMP}/eval-smoke/node-${{ matrix.node }}"

      - name: Upload eval smoke outputs
        if: always() && !inputs.capture_pre_edit_trace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-smoke-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eval-smoke/node-${{ matrix.node }}
          if-no-files-found: warn
          retention-days: 14

      - name: Run pre-edit context eval gate (mock embeddings)
        env:
          OCBI_CAPTURE_EVAL_TRACE: ${{ inputs.capture_pre_edit_trace }}
          OCBI_EVAL_SEARCH_TRACE_DIR: ${{ runner.temp }}/eval-pre-edit/node-${{ matrix.node }}/diagnostic
        run: |
          if [ "$OCBI_CAPTURE_EVAL_TRACE" = "true" ]; then
            node --import tsx --import ./.github/diagnostics/trace-eval-search.mjs src/cli.ts eval run \
              --config .github/eval-config.json --reindex \
              --dataset benchmarks/golden/pre-edit-context.json --ci \
              --budget benchmarks/budgets/pre-edit.json \
              --output "${RUNNER_TEMP}/eval-pre-edit/node-${{ matrix.node }}"
          else
            npm run eval:pre-edit:ci -- --output "${RUNNER_TEMP}/eval-pre-edit/node-${{ matrix.node }}"
          fi

      - name: Upload pre-edit context eval outputs
        if: always() && !inputs.capture_pre_edit_trace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-pre-edit-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eval-pre-edit/node-${{ matrix.node }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload reviewed pre-edit diagnostic metadata
        if: always() && inputs.capture_pre_edit_trace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-pre-edit-metadata-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/eval-pre-edit/node-${{ matrix.node }}/diagnostic/runtime.json
            ${{ runner.temp }}/eval-pre-edit/node-${{ matrix.node }}/diagnostic/inputs.json
            ${{ runner.temp }}/eval-pre-edit/node-${{ matrix.node }}/diagnostic/search.json
          if-no-files-found: error
          retention-days: 14

      - name: Stop mock embeddings server
        if: always()
        run: |
          if [ -f /tmp/eval-mock-embeddings.pid ]; then
            kill "$(cat /tmp/eval-mock-embeddings.pid)" || true
          fi

      - name: Setup minimum supported Node.js
        if: matrix.node == '22'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'

      - name: Smoke-test minimum supported runtime
        if: matrix.node == '22'
        env:
          npm_config_engine_strict: 'true'
        run: |
          node scripts/smoke-test-built-cli.mjs
          npm run smoke:package

  macos-consumer:
    if: ${{ !inputs.capture_pre_edit_trace }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: native -> target

      - name: Install dependencies
        run: npm ci

      - name: Build native module and TypeScript
        run: npm run build

      - name: Test native-backed context and omp contracts
        run: npx vitest run tests/tools-utils.test.ts tests/context-evidence-acceptance.test.ts tests/omp-package.test.ts

      - name: Smoke-test packed MCP and omp entrypoints
        run: npm run smoke:package -- --output-dir "${RUNNER_TEMP}/packed-cli-macos"

      - name: Check published-to-candidate index compatibility
        run: |
          npm run smoke:compatibility -- \
            --packages "${RUNNER_TEMP}/packed-cli-macos/validated-packages.json" \
            --output-dir "${RUNNER_TEMP}/package-compat-macos"

      - name: Upload package compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-compat-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/packed-cli-macos/validated-packages.json
            ${{ runner.temp }}/packed-cli-macos/command-*.json
            ${{ runner.temp }}/packed-cli-macos/stage-*/*.tgz
            ${{ runner.temp }}/package-compat-macos/report.json
          if-no-files-found: warn
          retention-days: 14
