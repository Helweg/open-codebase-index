name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  path-semantics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test canonical path semantics
        run: npx vitest run tests/canonical-path.test.ts

      - name: Record recursive native watcher capability
        run: npx vitest run tests/watcher-platform-capability.test.ts

      - name: Measure native watcher behavior
        run: npm run benchmark:watcher

  test:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: native -> target

      - name: Install dependencies
        run: npm ci

      - name: Check Rust formatting
        working-directory: native
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: native
        run: cargo clippy -- -D warnings

      - name: Run Rust tests
        working-directory: native
        run: cargo test

      - name: Build native module
        working-directory: native
        run: |
          cargo build --release
          npx napi build --release --platform

      - name: Build TypeScript
        run: npm run build:ts

      - name: Smoke-test packed CLI identities
        run: npm run smoke:package

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Validate frozen cross-repo benchmark inputs and comparator contracts
        run: npm run benchmark:cross-repo:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Start mock embeddings server for eval smoke
        run: |
          node scripts/eval-mock-embeddings-server.mjs > /tmp/eval-mock-embeddings.log 2>&1 &
          echo $! > /tmp/eval-mock-embeddings.pid
          healthy=0
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:11434/health >/dev/null; then
              echo "Mock embeddings server is healthy"
              healthy=1
              break
            fi
            sleep 0.25
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Mock embeddings server failed health check"
            exit 1
          fi

      - name: Run eval harness smoke check (mock embeddings)
        run: npm run eval:smoke

      - name: Run pre-edit context eval gate (mock embeddings)
        run: npm run eval:pre-edit:ci

      - name: Stop mock embeddings server
        if: always()
        run: |
          if [ -f /tmp/eval-mock-embeddings.pid ]; then
            kill "$(cat /tmp/eval-mock-embeddings.pid)" || true
          fi
